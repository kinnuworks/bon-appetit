[project]
name = "bonappetit"
version = "0.1.0"
description = "Swiss supermarket receipts to a household food picture, on your own computer, with Apertus."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pypdf>=4.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "torch>=2.3"]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
bonappetit = "bonappetit.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bonappetit = ["*.json"]
