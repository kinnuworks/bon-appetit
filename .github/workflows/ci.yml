name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: track_2b } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pytest
      - run: pytest -q tests
      - name: Re-score the stored evaluation and check the hash
        run: BONAPPETIT_REPLAY=1 BONAPPETIT_EMBED=0 python -m eval.score
